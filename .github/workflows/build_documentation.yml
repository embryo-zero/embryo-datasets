name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release
      - v*-patch

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@07d98817a2624c1fe067d4268e1f80d1988cfe71  # main
    with:
      commit_sha: ${{ github.sha }}
      package: datasets
      notebook_folder: datasets_doc
    secrets:
      token: ${{ secrets.HUGGINGFACE_PUSH }}
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
